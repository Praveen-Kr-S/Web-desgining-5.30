<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        .g{
            height: 100vh;
            background-color: bisque;
            display: grid;
            grid-template-columns: repeat(6,1fr);
            padding-left: 150px;
        }

        .i{
            height: 50vh;
            background-color: rgb(196, 255, 198);
        }

        .p{
            height: 100vh;
            background-color: rgb(216, 196, 255);
        }

        .box1{
            width: 150px;
            height: 150px;
            border: 3px solid gray;
            background-color: burlywood;
            position: static;
            left: 200px;
            top:100px;
        }

        .pr{
            height: 100vh;
            background-color: rgb(196, 252, 255);
        }

        .box2{
            width: 150px;
            height: 150px;
            border: 3px solid gray;
            background-color: burlywood;
            position: relative;
            left: 200px;
            /* top:100px; */
            bottom: -100px;
            
        }

    </style>


</head>
<body>

    <div class="i">

        <h1><i class="fa-brands fa-instagram"></i></h1>

        <h1><i class="fa-brands fa-linkedin"></i></h1>

        <i style="font-size: 50px;" class="fa-brands fa-telegram"></i>

    </div>


    <div class="g">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
        <img src="https://cdn.worldvectorlogo.com/logos/css-3.svg" alt="css_logo" width="100" height="100">
    </div>
    <div class="p">

        <div class="box1">
            <h1>Static</h1>
        </div>

    </div>

    <div class="pr">

        <div class="box2">
            <h1>Relative</h1>
        </div>

    </div>

</body>
</html>
