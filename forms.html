<body>

   <!-- Forms in HTML-5 -->

   <form action="">
        <label for="name">User Name : </label>
        <input type="text" id="name" required>
<br><br>
        <label for="age">User Age : </label>
        <input type="number" id="age" required>

        <br><br>
        <label for="email">User Email : </label>
        <input type="email" id="email" required placeholder="abc@gmail.com"
        >

        <br><br>
        <label for="phone">User Phone : </label>
        <input type="tel" id="phone" required placeholder="+91 0000000000" value="+91 ">

        <br><br>
        <label for="pass">Password : </label>
        <input type="password" id="pass" required>


        


        <br><br>
        <label for="message">Message : </label>
        <br>
        <textarea name="message : " id="message"></textarea>

<br><br>
        <label for="">Are Intrsted Course!!!!</label>
<br>
        <input type="checkbox"><label for="">Java</label>
        <input type="checkbox"><label for="">Python</label>
        <input type="checkbox"><label for="">React.Js</label>
        <input type="checkbox"><label for="">C++</label>


        <br><br>
        <label for="name">Your Contry : </label>
<br>
        <input type="radio" name="country"  value="india"><label for="">India</label>
        <input type="radio" name="country" value="china"><label for="">China</label>
        <input type="radio" name="country" value="France"><label for="">France</label>
        <input type="radio" name="country" value="Germani"><label for="">Germani</label>


        <br><br>
        <label for="state">Select the States : </label>
        <select name="States" id="state">
            <option value="TN">TN</option>
            <option value="KL">KL</option>
            <option value="KA">KA</option>
            <option value="AP">AP</option>
        </select>


        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Rest</button>

   </form>
