<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Locatoin Object</h1>
    <script>
        document.writeln(location.protocol,"<br>")
        document.writeln(location.pathname,"<br>")
        document.writeln(location.port,"<br>")
        document.writeln(location.origin,"<br>")
        document.writeln(location.hostname,"<br>")
        document.writeln(location.host,"<br>")
        
    </script>
</body>
</html>
