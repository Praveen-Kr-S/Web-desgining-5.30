<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("Screen Height",screen.availHeight,"<br>")
        document.write("Screen Width",screen.availWidth,"<br>")
        document.write("pixel",screen.pixelDepth,"<br>")
        document.write("orientation : ",screen.orientation.angle,"<br>")
        document.write("height : ",screen.height,"<br>")
    </script>
</body>
</html>
