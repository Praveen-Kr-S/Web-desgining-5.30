<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let b = window.navigator.language;
        document.writeln(b,"<br>")

        let b1 = window.navigator.appName;
        document.writeln(b1,"<br>")

        let b2 = window.navigator.appVersion;
        document.writeln(b2,"<br>")


    </script>
</body>
</html>
