<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    
</head>
<body>
    <!-- Container -->
    <div class="container bg-primary" >
        <h1 class="text-info">Extra Small</h1>
    </div>

    <div class="container-sm bg-secondary">
        <h1 class="text-primary">Small</h1>
    </div>

    <div class="container-md bg-danger">
        <h1 class="text-primary">Medium</h1>
    </div>

    <div class="container-lg bg-danger">
        <h1 class="text-secondary">Large</h1>
    </div>

    <!-- Grid -->
    <div class="container text-center my-5">
        <div class="row bg-primary py-3"> 
            <div class="col">Column 1</div> 
            <div class="col">Column 2</div> 
            <div class="col">Column 3</div>
            <div class="col">Column 4</div>
        </div> 
        <div class="row bg-warning py-3"> 
            <div class="col">Column 1</div> 
            <div class="col">Column 2</div> 
            <div class="col">Column 3</div>
            <div class="col">Column 4</div>
        </div> 
        <div class="row bg-success py-3"> 
            <div class="col">Column 1</div> 
            <div class="col">Column 2</div> 
            <div class="col">Column 3</div>
            <div class="col">Column 4</div>
        </div> 
    </div>

    



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
